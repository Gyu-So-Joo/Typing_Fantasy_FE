<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/game.css" />
    <title>Typing Fantasy</title>
  </head>

  <body>
    <main class="game-page">
      <section class="game-box">
        <!-- 1. 게임창 -->
        <section class="game-screen">
          <!-- 게임 캐릭터 이미지 -->
          <img src="img/player.png" class="player" />
          <img src="img/monster.png" class="monster" />
        </section>

        <!-- 2. 기록 영역 -->
        <section class="score-bar">
          <div>TIMER : <span class="time">60</span></div>
          <div>CPM : <span class="cpm">0</span></div>
          <div>ACC : <span class="accuracy">0</span></div>
        </section>

        <!-- 3. 타이핑 영역 -->
        <section class="typing-box">
          <div class="typing__text">
            <p>어서오세요. 타이핑 판타지입니다.</p>
          </div>

          <input
            class="input__field"
            type="text"
            autocomplete="off"
            placeholder="위 코드를 따라 입력하세요"
          />
        </section>
      </section>
    </main>

    <script src="JS/game.js"></script>
  </body>
</html>
