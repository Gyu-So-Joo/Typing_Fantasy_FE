<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <title>회원가입</title>
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="stylesheet" href="CSS/auth.css" />
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-wrap">
        <a href="main.html">
          <img class="auth-logo" src="img/logo.png" />
        </a>

        <div class="auth-box">
          <div class="register-form">
            <div id="registerMsg" class="msg"></div>

            <div class="form-group">
              <label>아이디</label>
              <input type="text" id="regId" placeholder="아이디를 입력하세요" />
            </div>

            <div class="form-group">
              <label>비밀번호</label>
              <input
                type="password"
                id="regPw"
                placeholder="비밀번호를 입력하세요"
              />
            </div>

            <button class="btn-login" onclick="register()">회원가입</button>
          </div>

          <div class="register-divider">
            <p>이미 계정이 있으신가요?</p>

            <a class="btn-register" href="login.html"> 로그인 하러가기 </a>
          </div>
        </div>
      </div>
    </div>

    <script src="js/auth.js"></script>
  </body>
</html>
