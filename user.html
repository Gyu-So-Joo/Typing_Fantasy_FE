<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>유저 정보</title>
    <link rel="stylesheet" href="/CSS/user.css" />
    <link rel="stylesheet" href="/CSS/style.css" />
  </head>
  <body>
    <!-- 헤더 영역 -->
    <header>
      <h1>
        <a href="main.html"><img class="logo" src="img/logo.png" /></a>
      </h1>
      <nav>
        <a href="rank.html"
          ><img class="ranking-logo" src="img/ranking.png"
        /></a>
        <a href="login.html"><img class="login-logo" src="img/login.png" /></a>
        <a href="user.html"><img class="user-logo" src="img/register.png" /></a>
      </nav>
    </header>

    <!-- 컨테이너 영역 -->
    <div class="container">
      <div class="container-head">
        <!-- 왼쪽 -->
        <div class="head-left">
          <img src="/img/logo.png" alt="로고" class="game-logo" />
        </div>

        <!-- 가운데 -->
        <div class="head-center">
          <h2>유저 정보</h2>
        </div>

        <!-- 오른쪽 -->
        <a href="encyclopedia.html" class="bookmark-btn"></a>
      </div>

      <div class="container-info">
        <!-- 유저 정보 -->
        <div class="user-info" id="userInfo">
          <h2>유저 정보</h2>
          <img src="/img/mocomo.png" alt="모코모" class="user-img" />
          <p id="userId">ID :</p>
        </div>
        <!-- 유저 언어 -->
        <div class="user-lan" id="userLan">
          <h2>사용언어</h2>
          <form action="#">
            <select name="language" id="langSelect">
              <option>Java</option>
              <option>JavaScript</option>
            </select>
          </form>
        </div>
      </div>
      <!-- 유저 통계 -->
      <div class="user-stat" id="userStat">
        <h2>내 게임 스타일 통계</h2>
      </div>
    </div>
    <!-- JS -->
    <script type="module" src="/JS/user.js"></script>
  </body>
</html>
