<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="src/css/style.css" />
    <link rel="stylesheet" href="src/css/auth.css" />
    <title>Typing Fantasy</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-wrap">
        <a href="main.html">
          <img class="auth-logo" src="src/assets/logo.png" />
        </a>

        <div class="auth-box">
          <div class="login-form">
            <div id="loginMsg" class="msg"></div>

            <div class="form-group">
              <label>아이디</label>
              <input
                type="text"
                id="loginId"
                placeholder="아이디를 입력하세요"
              />
            </div>

            <div class="form-group">
              <label>비밀번호</label>
              <input
                type="password"
                id="loginPw"
                placeholder="비밀번호를 입력하세요"
              />
            </div>

            <button class="btn-login" onclick="login()">로그인</button>
          </div>
          <div class="login-divider">
            <p>계정이 없으신가요?</p>
            <a class="btn-register" href="register.html">
              타이핑 판타지에 합류하기
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="src/js/auth.js"></script>
  </body>
</html>
